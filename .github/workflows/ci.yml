name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dsh-code-server
          submodules: true

      - name: Check out compatible DeepSeek Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: dsh-code-server
      - run: pnpm check
        working-directory: dsh-code-server
      - run: pnpm pack --pack-destination ../artifacts
        working-directory: dsh-code-server

      - name: Audit package paths
        run: |
          mkdir package-audit
          tar -xzf artifacts/dsh-code-server-*.tgz -C package-audit
          if grep -RIE '/home/|/Users/|\\Users\\|/tmp/' package-audit; then
            echo 'absolute local path found in package' >&2
            exit 1
          fi

      - name: Audit e2e sources for secrets and machine-specific paths
        run: |
          if grep -rInE '/home/[a-z]|/Users/[a-z]|\.claude|sk-[A-Za-z0-9]{16,}' dsh-code-server/tests/e2e; then
            echo 'local path, private directory or api-key-shaped secret found in tests/e2e' >&2
            exit 1
          fi

  e2e-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dsh-code-server
          submodules: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: dsh-code-server
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: dsh-code-server

      - name: Package the pinned runtime
        run: |
          mkdir runtime
          DSH_RUNTIME_TARGETS=linux-amd64 bash dsh-code-server/scripts/package-runtimes.sh runtime

      - name: Runtime settings E2E
        run: |
          mkdir runtime-x
          tar -xzf runtime/dsh-code-server-*-linux-amd64.tgz -C runtime-x
          node dsh-code-server/tests/e2e/runtime-settings.mjs \
            --runtime "$PWD/runtime-x/package/bin/dsh-code-server-runtime"
